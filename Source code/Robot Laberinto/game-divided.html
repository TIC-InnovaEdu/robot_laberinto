<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze 2 Players</title>
    <link rel="stylesheet" href="./css/styles-divided/style.css">
    <link rel="stylesheet" href="css/gamepad-bluetooth.css">
</head>
<body>
    <div id="page">
        <div id="Message-Container">
            <div id="message">
                <h1>Congratulations!</h1>
                <p id="winner"></p>
                <p id="moves"></p>
                <input id="okBtn" type="button" onclick="toggleVisablity('Message-Container')" value="Cool!" />
            </div>
        </div>

        <div id="menu">
            <div class="custom-select">
                <select id="diffSelect">
                    <option value="10">Easy</option>
                    <option value="15">Medium</option>
                    <option value="25">Hard</option>
                </select>
            </div>
            <input id="startMazeBtn" type="button" onclick="makeMaze()" value="Start" />
            <input id="logoutBtn" type="button" onclick="logout()" value="Volver al Menú" />
        </div>

        <div id="view">
            <div id="mazeContainer1" class="maze-container">
                <h3>Player 1 (WASD)</h3>
                <canvas id="mazeCanvas1" class="border" height="1100" width="1100"></canvas>
            </div>
            <div id="mazeContainer2" class="maze-container">
                <h3>Player 2 (Arrows)</h3>
                <canvas id="mazeCanvas2" class="border" height="1100" width="1100"></canvas>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery.touchswipe/1.6.18/jquery.touchSwipe.min.js"></script>
    <script type="module" src="./js/src-divided/main.js"></script>
    <script src="js/gamepad-serial.js"></script>
    
    <!-- Script de verificación de login -->
    <script>
        function logout() {
            window.location.href = 'menu.html';
        }
    </script>
</body>
</html>

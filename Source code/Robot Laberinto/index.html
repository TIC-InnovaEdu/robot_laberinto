<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Game - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">Maze Game</h1>
            <div class="maze-icon">🎮</div>
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" required autocomplete="email" placeholder=" ">
                    <label for="email">Correo electrónico</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" required autocomplete="current-password" placeholder=" ">
                    <label for="password">Contraseña</label>
                </div>
                <div id="error-message" class="error-message"></div>
                <button type="submit" id="loginButton" class="login-btn">
                    <span>Ingresar al Juego</span>
                    <div id="loginSpinner" class="spinner"></div>
                </button>
            </form>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>

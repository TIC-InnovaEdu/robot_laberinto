<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze 2 Players</title>
    <link rel="stylesheet" href="./css/styles-divided/style.css">
    <link rel="stylesheet" href="css/gamepad-bluetooth.css">
    <link rel="stylesheet" href="./css/styles-divided/gamepad-bluetooth2.css">
    <link rel="stylesheet" href="css/questionStyles.css">
</head>
<body>
    <div id="page">
        <!-- Modal para Jugador 1 -->
        <div id="questionModal1" class="question-modal" style="display: none;">
            <div class="modal-content">
                <h2>Pregunta para Jugador 1</h2>
                <p id="questionText1" class="question-text"></p>
                <div id="options1" class="options-container"></div>
                <div id="feedback1" class="feedback"></div>
            </div>
        </div>

        <!-- Modal para Jugador 2 -->
        <div id="questionModal2" class="question-modal" style="display: none;">
            <div class="modal-content">
                <h2>Pregunta para Jugador 2</h2>
                <p id="questionText2" class="question-text"></p>
                <div id="options2" class="options-container"></div>
                <div id="feedback2" class="feedback"></div>
            </div>
        </div>

        <div id="Message-Container">
            <div id="message">
                <h1>¡Felicitaciones!</h1>
                <p id="winner"></p>
                <p id="moves"></p>
                <input id="okBtn" type="button" onclick="toggleVisablity('Message-Container')" value="¡Genial!" />
            </div>
        </div>

        <div id="menu">
            <div class="custom-select">
                <select id="diffSelect">
                    <option value="10">Fácil</option>
                    <option value="15">Medio</option>
                    <option value="25">Difícil</option>
                </select>
            </div>
            <div class="custom-select">
                <select id="questionSelect">
                    <option value="3">3 Preguntas</option>
                    <option value="5">5 Preguntas</option>
                    <option value="7">7 Preguntas</option>
                </select>
            </div>
            <input id="startMazeBtn" type="button" onclick="makeMaze()" value="Comenzar" />
            <input id="logoutBtn" type="button" onclick="logout()" value="Volver al Menú" />
        </div>

        <div id="view">
            <div id="mazeContainer1" class="maze-container">
                <h3>Jugador 1 (WASD)</h3>
                <canvas id="mazeCanvas1" class="border" height="1100" width="1100"></canvas>
                <div id="progress1" class="progress">Preguntas: 0/3</div>
            </div>
            <div id="mazeContainer2" class="maze-container">
                <h3>Jugador 2 (Flechas)</h3>
                <canvas id="mazeCanvas2" class="border" height="1100" width="1100"></canvas>
                <div id="progress2" class="progress">Preguntas: 0/3</div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery.touchswipe/1.6.18/jquery.touchSwipe.min.js"></script>
    <script src="js/questions.js"></script>
    <script type="module" src="./js/src-divided/main.js"></script>
    <script src="js/gamepad-serial.js"></script>
    <script src="./js/src-divided/gamepad-serial2.js"></script>

    
    <script>
        function logout() {
            window.location.href = 'menu.html';
        }
    </script>
</body>
</html>
